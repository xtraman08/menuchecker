name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  db-integration:
    name: DB / RLS integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cp .env.example .env && sed -i "s/^JWT_SECRET=.*/JWT_SECRET=ci-$(openssl rand -hex 16)/" .env
      - run: docker compose up -d --wait db
      - run: npm run db:migrate
      - run: npm run test:integration
      - if: always()
        run: docker compose down -v

  e2e:
    name: E2E (docker compose + Playwright)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create .env
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=ci-$(openssl rand -hex 16)/" .env
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run e2e
        run: npm run test:e2e
        env:
          # Real Claude API; scan/decode specs skip themselves when the secret is absent (e.g. forks).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

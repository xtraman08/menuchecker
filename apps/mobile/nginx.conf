# nginx config for the Expo web export (single-page output, client-side routing).
# Note: add_header inside a location replaces server-level ones, so each location
# repeats the security headers.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  location /_expo/static/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/ /index.html;
  }
}
